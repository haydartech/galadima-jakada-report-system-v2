name: Build GJA Report Card APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "assets/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      
      - name: Accept licenses and install Android SDK packages
        shell: bash
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' \
            '84831b9409646a918e30573bab4c9c91346d8abd' \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare offline app
        shell: bash
        run: |
          set -e

          test -f index.html
          test -f style.css
          test -f script.js

          mkdir -p apk-build/www
          cp index.html style.css script.js apk-build/www/

          if [ -d assets ]; then
            cp -R assets apk-build/www/
          fi

          cd apk-build
          npm init -y

          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7 esbuild
          npm install @capgo/capacitor-printer@7

          cat > print-bridge.js <<'EOF'
          import { Printer } from "@capgo/capacitor-printer";
          window.GJAPrinter = Printer;
          EOF

          npx esbuild print-bridge.js --bundle --format=iife --outfile=www/print-bridge.js

          node --input-type=commonjs <<'EOF'
          const fs = require("fs");
          const path = "www/index.html";
          let html = fs.readFileSync(path, "utf8");

          if (!html.includes("print-bridge.js")) {
            const tag = '<script src="print-bridge.js"></script>\n';
            if (/<\/head>/i.test(html)) {
              html = html.replace(/<\/head>/i, tag + "</head>");
            } else {
              html = tag + html;
            }
          }

          fs.writeFileSync(path, html);
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.galadimajakada.reportcard",
            "appName": "GJA Report Card",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd apk-build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GJA-Report-Card-APK
          path: apk-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
